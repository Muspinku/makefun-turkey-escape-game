<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gobble Run — A Turkey Escape</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a0c; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    display: block; touch-action: none; cursor: pointer;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Gobble Run: a turkey escapes the farmer before Thanksgiving. Space or click to jump, down arrow to duck."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { GobbleRun } from './src/main.js';
  GobbleRun.boot(document.getElementById('game'));
</script>
</body>
</html>
